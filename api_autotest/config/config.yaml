# 环境配置
env:
  test:
    base_url: "https://hjytest.ali2.huice.cc/huice/api/recon"
    timeout: 30
  prod:
    base_url: "http://api.example.com"
    timeout: 30

# 全局请求头
headers:
  Content-Type: "application/json"
  User-Agent: "ApiTest/1.0"

# 日志配置
logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/api_test.log"